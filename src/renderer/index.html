<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>codingSchedule</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="themes.css"></head>
<body><main id="widget" data-expanded="false" data-side="right" data-theme="porthole">
<button id="edge-tab" hidden data-known="false" data-value="0" aria-label="恢复任务悬浮框" title="悬停或点击恢复悬浮框">
  <span class="edge-gauge" aria-hidden="true"><svg class="edge-ring" viewBox="0 0 24 24"><circle class="edge-ring-track" cx="12" cy="12" r="10" pathLength="100"></circle><circle id="edge-ring-value" cx="12" cy="12" r="10" pathLength="100"></circle></svg><span id="edge-value">—</span><svg class="edge-complete edge-mark" viewBox="0 0 16 16"><path d="m4 8 3 3 5-6"></path></svg><svg class="edge-failure edge-mark" viewBox="0 0 16 16"><path d="m5 5 6 6m0-6-6 6"></path></svg></span>
  <span class="edge-direction" aria-hidden="true"><svg class="edge-chevron" viewBox="0 0 16 16"><path d="m9.5 4.5-3.5 3.5 3.5 3.5"></path></svg><svg class="edge-pause" viewBox="0 0 16 16"><path d="M6 5v6m4-6v6"></path></svg></span>
  <span class="edge-linear-track" aria-hidden="true"><span></span></span>
</button>
<div id="hinge" aria-hidden="true" hidden><span></span><span></span><span></span></div>
<div id="compact" role="button" tabindex="0" aria-controls="details" aria-expanded="false" aria-label="暂无活动会话，点击展开">
<div id="screen-content">
  <svg id="screen-ring" viewBox="0 0 224 224" aria-hidden="true"><circle class="screen-ring-track" cx="112" cy="112" r="105" pathLength="100"></circle><circle id="screen-ring-value" cx="112" cy="112" r="105" pathLength="100"></circle></svg>
  <div class="screen-top"><span id="screen-provider">本机</span><span id="screen-short-state"></span><span id="count"></span><span id="signal" aria-hidden="true"></span></div>
  <div class="screen-identity"><span id="screen-project">codingSchedule</span><strong id="screen-session">暂无活动会话</strong></div>
  <div id="screen-porthole" data-known="false">
    <svg id="porthole-ring" viewBox="0 0 100 100" aria-hidden="true"><circle class="screen-ring-track" cx="50" cy="50" r="47" pathLength="100"></circle><circle id="porthole-ring-value" cx="50" cy="50" r="47" pathLength="100"></circle></svg>
    <div class="screen-time"><span id="porthole-caption">等待任务</span><strong id="screen-eta">—</strong><span id="screen-eta-label">暂无估时</span></div>
  </div>
  <div class="screen-gauge"><strong id="screen-progress">—</strong><span id="screen-progress-label">等待任务</span></div>
  <div id="screen-meter" aria-hidden="true"><div id="compact-track"><span id="compact-fill"></span></div><div id="terminal-raster"></div><div id="silver-scale"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div></div>
  <div class="screen-bottom"><span id="screen-state">自动检测中</span><span id="screen-freshness"></span><span id="health" role="status" hidden></span><span id="drag-handle" title="拖动整块状态屏移动" aria-label="拖动位置">⠿ <span id="screen-toggle-hint">点击展开</span></span></div>
  <span id="appearance-feedback" role="status" hidden></span>
  <span id="compact-title" class="sr-only">暂无活动会话</span><span id="summary" class="sr-only">自动检测中</span>
</div>
</div>
<div id="screen-controls" class="surface-controls"><button id="resize-compact" class="resize-handle" title="拖动调整大小，缩小自动精简；方向键微调，Home恢复大小">◢</button></div>
<div id="wing-controls" class="surface-controls" hidden><button id="resize-details" class="resize-handle" title="拖动调整收起尺寸，详情保持可读；方向键微调，Home恢复大小">◢</button></div>
<section id="details" hidden aria-label="任务详情">
<div id="wing-content">
  <header class="wing-header"><span class="device-brand">codingSchedule</span><button id="pin" aria-pressed="false">固定展开</button><button id="collapse" class="icon-button" aria-label="收起详情" title="收起详情">−</button></header>
  <div id="task-view">
    <div id="task-scroll">
      <div class="task-meta"><span id="provider-label">本机会话</span><span id="status"></span></div>
      <h1 id="title">暂无活动会话</h1><p id="task-title" hidden></p><p id="health-detail" class="inline-warning" hidden></p>
      <div class="activity-block"><div class="activity-heading"><span id="activity-label" class="eyebrow">等待任务开始</span><div class="activity-views" role="group" aria-label="当前动作视角"><button id="activity-work" type="button" aria-pressed="true" aria-controls="activity">工作事项</button><button id="activity-execution" type="button" aria-pressed="false" aria-controls="activity">执行状态</button></div></div><p id="activity" tabindex="0">开始 Codex 或 Claude 任务后自动显示。</p><span id="activity-source" class="muted">开始会话后显示</span></div>
      <div class="progress-section"><div class="metrics"><strong id="progress">进度未知</strong><span id="eta">暂不能估时</span></div><div id="track" role="progressbar" aria-label="计划完成度" aria-valuemin="0" aria-valuemax="100"><span id="fill"></span></div></div>
      <ul id="steps" aria-label="计划步骤"></ul><p id="steps-empty" class="muted" hidden>尚未收到计划，完成度保持未知。</p>
      <div class="task-evidence"><p id="eta-inquiry" class="muted" role="status" hidden></p><p id="basis" class="muted"></p><p id="freshness" class="muted"></p></div>
    </div>
    <footer class="task-footer"><div class="task-switcher"><label for="tasks">会话</label><select id="tasks" aria-label="选择活动会话"></select></div><div class="footer-actions"><button id="follow" hidden>自动跟随</button><button id="settings-button">接入 / 设置</button></div></footer>
  </div>
  <section id="settings" hidden aria-label="接入设置"><div class="row"><h1>接入 / 设置</h1><button id="back">返回任务</button></div><p class="muted">自动检测本机 AI 会话，可在下方关闭来源。</p><div id="settings-content"></div><button id="reset">重置悬浮框位置</button></section>
</div>
</section>
</main><script src="app.js"></script></body></html>
