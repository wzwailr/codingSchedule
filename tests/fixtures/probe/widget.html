<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'"><title>codingSchedule 技术样机</title><style>
:root{color-scheme:dark;font-family:'Segoe UI','Microsoft YaHei UI',sans-serif;--surface:#17212b;--text:#edf3f8;--muted:#bdc9d6;--accent:#6dd5be}*{box-sizing:border-box}body{margin:0;background:var(--surface);color:var(--text);font-size:13px}header{height:48px;display:flex;align-items:center;gap:10px;padding:0 16px;border:1px solid #405063;border-radius:10px}.dot{width:8px;height:8px;background:var(--accent);border-radius:50%;flex-shrink:0}strong{font-weight:600}span{color:var(--muted)}.details{padding:16px;line-height:1.8}p{margin:0 0 8px}.track{height:3px;background:#405063;border-radius:2px}.track i{display:block;width:60%;height:100%;background:var(--accent)}.note{font-size:12px;color:var(--muted)}@media(prefers-reduced-motion:no-preference){.details{animation:reveal 120ms ease-out}@keyframes reveal{from{opacity:.3}to{opacity:1}}}
body{height:100vh;overflow:hidden}header{position:absolute;bottom:0;width:100%}.details{position:absolute;bottom:48px;top:0;width:100%;overflow:hidden}
</style></head><body><header aria-label="技术样机，计划完成度百分之六十"><i class="dot" aria-hidden="true"></i><strong>Codex · 计划 3/5</strong><span>60%</span><span>样机</span></header><section class="details"><p><strong>正在：验证悬浮窗体验</strong></p><p class="note">这是技术样例数据，真实任务接入在阶段三。</p><div class="track" role="progressbar" aria-label="样例计划进度" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100"><i></i></div><p class="note">悬停展开 · 不获取键盘焦点 · 减少动画可用</p></section><script>
let timer;document.body.addEventListener('mouseenter',()=>{clearTimeout(timer);timer=setTimeout(()=>window.sample.hover(true),250)});document.body.addEventListener('mouseleave',()=>{clearTimeout(timer);timer=setTimeout(()=>window.sample.hover(false),400)});
</script></body></html>
